name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          target: default
          arch: x86_64

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Create .env file for mobile
        working-directory: ./mobile
        run: |
          echo "API_URL=${{ secrets.API_URL || 'https://adlc-backend.onrender.com' }}" > .env
          echo "MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN || '' }}" >> .env
          echo "WS_URL=${{ secrets.WS_URL || 'wss://adlc-backend.onrender.com' }}" >> .env

      - name: Install Expo CLI and EAS CLI
        run: npm install -g @expo/cli eas-cli

      - name: Setup Expo (if credentials provided)
        if: ${{ secrets.EXPO_TOKEN != '' }}
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            npx expo login --non-interactive || echo "Expo login failed, continuing with local build"
          fi

      - name: Prebuild Android project
        working-directory: ./mobile
        run: |
          npx expo prebuild --platform android --clean

      - name: Build APK with Gradle
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

